name: Graphql Schema Check
 
on: [push]
 
jobs:
  test:
    name: Check Schema
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
 
    steps:
      - uses: actions/checkout@v6

      - uses: graphql-hive/graphql-inspector@master
        with:
          schema: 'develop:apps/backend/schema.gql'
          # annotations: false

